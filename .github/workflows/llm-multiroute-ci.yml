name: LLM Multiroute CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - 'llm-multiroute/**'
      - '.trivyignore'
      - '.github/workflows/llm-multiroute-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'llm-multiroute/**'
      - '.trivyignore'
      - '.github/workflows/llm-multiroute-ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: llm-multiroute

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: llm-multiroute/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with Ruff
        run: ruff check .

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: llm-multiroute/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v --tb=short

  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: insipidity/llm-multiroute
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image for scanning
        uses: docker/build-push-action@v6
        with:
          context: llm-multiroute
          load: true
          pull: true
          labels: ${{ steps.meta.outputs.labels }}
          tags: insipidity/llm-multiroute:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"
        with:
          image-ref: insipidity/llm-multiroute:scan
          version: 'v0.74.0'
          scanners: 'vuln'
          format: 'json'
          output: 'trivy-results.json'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          trivyignores: .trivyignore

      - name: Save vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-multiroute-trivy
          path: trivy-results.json
          if-no-files-found: warn

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: insipidity
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push the scanned Docker image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag insipidity/llm-multiroute:scan "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
