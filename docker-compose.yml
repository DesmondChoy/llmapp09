services:
  llm-multiroute:
    build: ./llm-multiroute
    container_name: llm-multiroute
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-https://ollama.com}
      - OLLAMA_TEMPERATURE=${OLLAMA_TEMPERATURE:-0.7}
      - OLLAMA_MODEL_CLASSIFY=${OLLAMA_MODEL_CLASSIFY:-gemma4:31b}
      - OLLAMA_MODEL_SENTIMENT=${OLLAMA_MODEL_SENTIMENT:-glm-5.2}
      - OLLAMA_MODEL_SUMMARIZE=${OLLAMA_MODEL_SUMMARIZE:-mistral-large-3:675b}
      - OLLAMA_MODEL_INTENT=${OLLAMA_MODEL_INTENT:-minimax-m3}
      - SERVER_PORT=8080
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://cloud.langfuse.com}
    volumes:
      - llm-metrics:/app/metrics
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/ai/routes', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s
    networks:
      - llm-network

  llm-frontend-python:
    build: ./llm-frontend-python
    container_name: llm-frontend-python
    ports:
      - "${FRONTEND_PORT:-5000}:5000"
    environment:
      - BACKEND_URL=http://llm-multiroute:8080
      - FLASK_PORT=5000
      - FLASK_DEBUG=false
    depends_on:
      llm-multiroute:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
    networks:
      - llm-network

networks:
  llm-network:
    driver: bridge

volumes:
  llm-metrics:
